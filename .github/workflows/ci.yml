name: ML Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install libraries
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest -v --cov=data_processing --cov=train \
            --cov-report=term-missing --junitxml=report.xml

      - name: Save test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-report
          path: report.xml